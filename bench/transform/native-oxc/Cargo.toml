[package]
name = "bench_oxc"
version = "0.1.0"
edition = "2024"
[workspace]
[lib]
crate-type = ["cdylib", "staticlib"]
[dependencies]
oxc_allocator = "=0.155.0"
oxc_codegen = "=0.155.0"
oxc_parser = "=0.155.0"
oxc_semantic = "=0.155.0"
oxc_span = "=0.155.0"
oxc_transformer = "=0.155.0"
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
