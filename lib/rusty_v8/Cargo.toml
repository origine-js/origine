[package]
name = "v8"
version = "152.2.0"
description = "Rust bindings to V8"
readme = "README.md"
authors = ["the Deno authors"]
license = "MIT"
edition = "2024"
repository = "https://github.com/denoland/rusty_v8"

[profile.dev]
# rusty_v8 may miscompile at opt-level=0.
# https://github.com/rust-lang/rust/issues/87215
# https://github.com/rust-lang/rust/issues/75839
# https://github.com/rust-lang/rust/issues/121028
opt-level = 1

[features]
default = ["use_custom_libcxx", "v8_enable_pointer_compression", "v8_enable_sandbox"]
use_custom_libcxx = []
# Deprecated no-op: simdutf is always built in. Kept so that downstream
# crates passing `--features simdutf` continue to build; remove at the next
# major version.
simdutf = []
v8_enable_pointer_compression = []
v8_enable_sandbox = ["v8_enable_pointer_compression"]
v8_enable_v8_checks = []
# v8_inspector + CRDTP bindings. Needs the matching shims in lib/v8_zig/binding (not ported yet).
inspector = []

[dependencies]
bitflags = "2.5"
paste = "1.0"
temporal_capi = { version = "0.2.3", features = ["zoneinfo64"] }

[build-dependencies]
bindgen = "0.72"
serde_json = "1"

[dev-dependencies]
bytes = "1"
align-data = "0.1.0"
trybuild = "1.0.96"
rustversion = "1"

[[example]]
name = "hello_world"

[[example]]
name = "shell"

[[example]]
name = "process"

[[bench]]
name = "function"
path = "benches/function.rs"
harness = false

[[bench]]
name = "string_read"
path = "benches/string_read.rs"
harness = false

[[bench]]
name = "string_encode"
path = "benches/string_encode.rs"
harness = false

[workspace]
