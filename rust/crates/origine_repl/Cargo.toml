[package]
name = "origine_repl"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
oxc_diagnostics.workspace = true
oxc_parser.workspace = true
oxc_span.workspace = true
oxc_syntax.workspace = true
origine_oxc = { workspace = true, optional = true }
unicode-width = "0.2.2"

[features]
# Erase TypeScript types from REPL input (needs the oxc transformer). Without it the input is
# parsed as JavaScript and run as written.
typescript = ["dep:origine_oxc"]

[lints]
workspace = true
