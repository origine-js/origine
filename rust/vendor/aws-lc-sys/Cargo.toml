# Vendored aws-lc-sys, patched to use the Zig-built AWS-LC (lib/aws-lc). See README.md.
#
# Derived from the crates.io package of the same version (see README.md for the diff). The
# version and the `links` key must stay those of upstream: `Cargo.lock` pins the version and the
# Zig-built library's symbol prefix (and aws-lc-rs's `DEP_AWS_LC_*_INCLUDE`) come from `links`.

[package]
edition = "2021"
rust-version = "1.71.0"
name = "aws-lc-sys"
version = "0.47.0"
authors = ["AWS-LC"]
build = "build.rs"
links = "aws_lc_0_47_0"
description = "AWS-LC is a general-purpose cryptographic library maintained by the AWS Cryptography team for AWS and their customers. It іs based on code from the Google BoringSSL project and the OpenSSL project."
readme = "README.md"
license = "ISC AND (Apache-2.0 OR ISC) AND Apache-2.0 AND MIT AND BSD-3-Clause AND (Apache-2.0 OR ISC OR MIT) AND (Apache-2.0 OR ISC OR MIT-0)"
repository = "https://github.com/aws/aws-lc-rs"

[package.metadata.aws-lc-sys]
commit-hash = "cd481c207e38f06aeb5766f4a1cdfce10a4c0af8"

# Kept so aws-lc-rs's optional features still resolve; this crate ignores all of them. The
# `universal` bindings are always the ones in src/.
[features]
all-bindings = []
asan = []
bindgen = []
default = []
disable-prebuilt-nasm = []
fips = []
prebuilt-nasm = []
ssl = ["all-bindings"]
unstable = []

[lib]
name = "aws_lc_sys"
path = "src/lib.rs"
